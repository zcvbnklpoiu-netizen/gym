<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="join.css">
</head>
<body>
    


<div class="container">

    <h1>Join <span>Peak Fitness</span></h1>

    <p>Fill in your information to become a member.</p>

    <form>

        <input type="text" id="fullname" placeholder="Full Name" required>

        <input type="tel" id="phoneNumber" placeholder="Phone Number" required>

        <input type="number" id="age" placeholder="Age" required>

        <select id="plan" required>
            <option value="" selected disabled>Select Membership Plan</option>
            <option>Basic Plan</option>
            <option>Pro Plan</option>
            <option>Elite Plan</option>
        </select>

        <textarea id="message" placeholder="Message (Optional)"></textarea>

        <button type="submit" id="submitbtn">Submit</button>

    </form>

</div>
<script src="join.js"></script>

</body>
